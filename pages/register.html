<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BookMyShow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== REGISTER PAGE ANIMATIONS (login jaisa hi) ===== */
        /* Background floating glow blobs */
        .auth-wrapper { position: relative; overflow: hidden; }
        .auth-blob {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35;
            pointer-events: none; z-index: 0;
            animation: blobFloat 12s ease-in-out infinite alternate;
        }
        .auth-blob.b1 { width: 320px; height: 320px; background: #e11d48; top: -80px; right: -100px; }
        .auth-blob.b2 { width: 280px; height: 280px; background: #4f46e5; bottom: -60px; left: -80px; animation-delay: -4s; animation-duration: 15s; }
        .auth-blob.b3 { width: 190px; height: 190px; background: #f59e0b; top: 40%; left: 60%; opacity: 0.18; animation-delay: -8s; animation-duration: 18s; }
        @keyframes blobFloat {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(50px, 30px) scale(1.12); }
            100% { transform: translate(-30px, -40px) scale(0.95); }
        }

        /* Card: chhota + entrance + animated gradient border */
        .auth-card {
            position: relative; z-index: 1;
            max-width: 290px;            /* compact */
            padding: 1.15rem 1rem;       /* tight */
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .auth-card .auth-header { margin-bottom: 1.25rem; }
        .auth-card .auth-header h2 { font-size: 1.5rem; }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(36px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-card::before {
            content: ''; position: absolute; inset: -2px; border-radius: inherit; z-index: -1;
            background: linear-gradient(120deg, #e11d48, #8b5cf6, #f59e0b, #e11d48);
            background-size: 300% 300%;
            filter: blur(10px); opacity: 0.35;
            animation: borderFlow 6s linear infinite;
        }
        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Staggered entrance */
        .auth-header h2 { animation: slideUp 0.6s 0.12s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-header p  { animation: slideUp 0.6s 0.22s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-card .form-group:nth-of-type(1) { animation: slideUp 0.6s 0.3s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-card .form-group:nth-of-type(2) { animation: slideUp 0.6s 0.38s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-card .form-group:nth-of-type(3) { animation: slideUp 0.6s 0.46s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-card .form-group:nth-of-type(4) { animation: slideUp 0.6s 0.54s cubic-bezier(0.22,1,0.36,1) both; }
        #register-form > .btn { animation: slideUp 0.6s 0.62s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-footer { animation: slideUp 0.6s 0.7s cubic-bezier(0.22,1,0.36,1) both; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Compact form spacing */
        .auth-card .form-group { margin-bottom: 0.7rem; }
        .auth-card .auth-footer { margin-top: 1rem; }
    </style>
    <style>
        /* Input focus lift + glow */
        .auth-card .form-group input { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
        .auth-card .form-group input:focus {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.15), 0 8px 24px rgba(0,0,0,0.35);
        }
        .auth-card .form-group label { transition: color 0.25s ease; }
        .form-group:focus-within label { color: var(--primary); }

        /* Sign Up button shine + hover */
        #register-form > .btn {
            position: relative; overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        #register-form > .btn::after {
            content: ''; position: absolute; top: 0; left: -80%;
            width: 50%; height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-20deg);
            animation: shine 3.2s ease-in-out infinite;
        }
        @keyframes shine {
            0%, 60% { left: -80%; }
            80%, 100% { left: 130%; }
        }
        #register-form > .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(225,29,72,0.4); }
        #register-form > .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }

        /* Loading spinner */
        .btn-loading .btn-spinner {
            display: inline-block; width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: -2px; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Logo glow */
        .navbar .logo { animation: logoGlow 3s ease-in-out infinite; }
        @keyframes logoGlow {
            0%, 100% { text-shadow: 0 0 12px rgba(225,29,72,0.5); }
            50% { text-shadow: 0 0 26px rgba(225,29,72,0.9); }
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-blob, #register-form > .btn::after, .navbar .logo { animation: none !important; }
        }
    </style>
</head>
<body>

    <!-- Floating background blobs -->
    <div class="auth-blob b1"></div>
    <div class="auth-blob b2"></div>
    <div class="auth-blob b3"></div>

    <nav class="navbar">
        <a href="../index.html" class="logo">Book<span>My</span>Show</a>
        <button class="nav-toggle" id="nav-toggle" onclick="toggleNav(event)" aria-label="Toggle menu"><span class="hamburger"></span></button>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="theaters.html">Theaters</a>
        </div>
        <div class="nav-user" id="nav-user"></div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Account <span style="color:var(--primary);">▶</span></h2>
                <p>Join BookMyShow to book shows & tickets seamlessly</p>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; padding: 0.85rem;">
                    Sign Up
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=2"></script>
    <script src="../js/utils.js?v=2"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.classList.add('btn-loading');
            submitBtn.innerHTML = '<span class="btn-spinner"></span> Creating Account...';

            const data = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value,
                role: 'USER'
            };

            try {
                const user = await UserAPI.register(data);
                setLoggedInUser(user);
                submitBtn.innerHTML = '<span class="btn-spinner"></span> Welcome!';
                showToast('Account created successfully!', 'success');
                setTimeout(() => window.location.href = '../index.html', 800);
            } catch (err) {
                showToast(err.message || 'Registration failed. Try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-loading');
                submitBtn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
