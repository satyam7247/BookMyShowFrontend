<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookMyShow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== LOGIN PAGE ANIMATIONS ===== */
        /* Background me floating glow blobs */
        .auth-wrapper { position: relative; overflow: hidden; }
        .auth-blob {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35;
            pointer-events: none; z-index: 0;
            animation: blobFloat 12s ease-in-out infinite alternate;
        }
        .auth-blob.b1 { width: 340px; height: 340px; background: #e11d48; top: -80px; left: -100px; }
        .auth-blob.b2 { width: 280px; height: 280px; background: #4f46e5; bottom: -60px; right: -80px; animation-delay: -4s; animation-duration: 15s; }
        .auth-blob.b3 { width: 200px; height: 200px; background: #f59e0b; top: 45%; left: 65%; opacity: 0.18; animation-delay: -8s; animation-duration: 18s; }
        @keyframes blobFloat {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(50px, 30px) scale(1.12); }
            100% { transform: translate(-30px, -40px) scale(0.95); }
        }

        /* Card entrance + animated gradient border glow */
        .auth-card { position: relative; z-index: 1; max-width: 380px; padding: 1.75rem 1.5rem; animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .auth-card .auth-header { margin-bottom: 1.25rem; }
        .auth-card .auth-header h2 { font-size: 1.5rem; }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(36px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-card::before {
            content: ''; position: absolute; inset: -2px; border-radius: inherit; z-index: -1;
            background: linear-gradient(120deg, #e11d48, #8b5cf6, #f59e0b, #e11d48);
            background-size: 300% 300%;
            filter: blur(10px); opacity: 0.35;
            animation: borderFlow 6s linear infinite;
        }
        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header stagger entrance */
        .auth-header h2 { animation: slideUp 0.6s 0.15s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-header p  { animation: slideUp 0.6s 0.28s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-card .form-group:nth-of-type(1) { animation: slideUp 0.6s 0.38s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-card .form-group:nth-of-type(2) { animation: slideUp 0.6s 0.48s cubic-bezier(0.22,1,0.36,1) both; }
        #login-form > .btn { animation: slideUp 0.6s 0.58s cubic-bezier(0.22,1,0.36,1) both; }
        .login-divider { animation: slideUp 0.6s 0.66s cubic-bezier(0.22,1,0.36,1) both; }
        #google-login-btn { animation: slideUp 0.6s 0.72s cubic-bezier(0.22,1,0.36,1) both; }
        .auth-footer { animation: slideUp 0.6s 0.8s cubic-bezier(0.22,1,0.36,1) both; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Waving hand */
        .fa-hand { display: inline-block; transform-origin: 70% 70%; animation: wave 2.2s ease-in-out 1s infinite; }
        @keyframes wave {
            0%, 60%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(16deg); }
            20% { transform: rotate(-10deg); }
            30% { transform: rotate(14deg); }
            40% { transform: rotate(-6deg); }
            50% { transform: rotate(10deg); }
        }

        /* Input focus: lift + pink glow */
        .auth-card .form-group input { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
        .auth-card .form-group input:focus {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.15), 0 8px 24px rgba(0,0,0,0.35);
        }
        .auth-card .form-group label { transition: color 0.25s ease; }
        .form-group:focus-within label { color: var(--primary); }
    </style>
    <style>
        /* Sign In button shine sweep + hover lift */
        #login-form > .btn {
            position: relative; overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        #login-form > .btn::after {
            content: ''; position: absolute; top: 0; left: -80%;
            width: 50%; height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-20deg);
            animation: shine 3.2s ease-in-out infinite;
        }
        @keyframes shine {
            0%, 60% { left: -80%; }
            80%, 100% { left: 130%; }
        }
        #login-form > .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(225,29,72,0.4); }
        #login-form > .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }

        /* Sign In loading spinner */
        .btn-loading .btn-spinner {
            display: inline-block; width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: -2px; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Google button hover */
        #google-login-btn { transition: transform 0.25s ease, box-shadow 0.25s ease; }
        #google-login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.45); }
        #google-login-btn:hover svg { animation: gBounce 0.5s ease; }
        @keyframes gBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            40% { transform: translateY(-4px) rotate(-6deg); }
            70% { transform: translateY(-1px) rotate(4deg); }
        }

        /* Logo glow pulse */
        .navbar .logo { animation: logoGlow 3s ease-in-out infinite; }
        @keyframes logoGlow {
            0%, 100% { text-shadow: 0 0 12px rgba(225,29,72,0.5); }
            50% { text-shadow: 0 0 26px rgba(225,29,72,0.9); }
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-blob, .fa-hand, #login-form > .btn::after, .navbar .logo { animation: none !important; }
        }
    </style>
</head>
<body>

    <!-- Floating background blobs -->
    <div class="auth-blob b1"></div>
    <div class="auth-blob b2"></div>
    <div class="auth-blob b3"></div>

    <nav class="navbar">
        <a href="../index.html" class="logo">Book<span>My</span>Show</a>
        <button class="nav-toggle" id="nav-toggle" onclick="toggleNav(event)" aria-label="Toggle menu"><span class="hamburger"></span></button>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="theaters.html">Theaters</a>
        </div>
        <div class="nav-user" id="nav-user"></div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back <i class="fa-solid fa-hand"></i></h2>
                <p>Sign in to access your movie bookings & admin controls</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="e.g. admin123@gmail.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; padding: 0.85rem;">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="login-divider" style="display:flex; align-items:center; gap:0.75rem; margin:1.25rem 0 0.75rem;">
                <div style="flex:1; height:1px; background:rgba(255,255,255,0.15);"></div>
                <span style="color:var(--text-muted); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:1px;">or</span>
                <div style="flex:1; height:1px; background:rgba(255,255,255,0.15);"></div>
            </div>

            <!-- Google Sign-In -->
            <button type="button" id="google-login-btn" class="btn btn-outline btn-block" style="padding:0.85rem; background:#ffffff; color:#1f2937; border-color:#ffffff; font-weight:700; display:flex; align-items:center; justify-content:center; gap:0.6rem;" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0;">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/google-config.js"></script>
    <script src="../js/utils.js?v=2"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.classList.add('btn-loading');
            submitBtn.innerHTML = '<span class="btn-spinner"></span> Signing In...';

            const data = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const user = await UserAPI.login(data);
                setLoggedInUser(user);
                submitBtn.innerHTML = '<span class="btn-spinner"></span> Welcome!';
                showToast(`Welcome back, ${user.name || 'User'}!`, 'success');
                setTimeout(() => {
                    if (userIsAdmin()) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = '../index.html';
                    }
                }, 800);
            } catch (err) {
                showToast(err.message || 'Login failed. Please check credentials.', 'error');
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-loading');
                submitBtn.innerHTML = originalText;
            }
        }

        // ===== GOOGLE SIGN-IN =====
        // Client ID Google Cloud Console se milega (see js/google-config.js)
        const GOOGLE_CLIENT_ID = (typeof window !== 'undefined' && window.__GOOGLE_CLIENT_ID) || '';

        function handleGoogleLogin() {
            if (!GOOGLE_CLIENT_ID) {
                showToast('Google login setup pending: Google Cloud Console me OAuth Client ID banao aur js/google-config.js me daalo.', 'info');
                return;
            }
            if (typeof google === 'undefined' || !google.accounts) {
                showToast('Google script load nahi hui. Internet check karein.', 'error');
                return;
            }
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredential
            });
            google.accounts.id.prompt();
        }

        // JWT ID token decode (payload part)
        function decodeGoogleJwt(token) {
            try {
                const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(escape(atob(payload))));
            } catch (e) { return null; }
        }

        async function handleGoogleCredential(response) {
            showToast('Google se login ho raha hai...', 'info');
            const profile = decodeGoogleJwt(response.credential);
            if (!profile || !profile.email) {
                showToast('Google login fail hua. Dobara try karein.', 'error');
                return;
            }
            let user = null;
            // Pehle backend ko ID token bhejo (server proper verify karta hai)
            try {
                user = await UserAPI.googleLogin({ idToken: response.credential, email: profile.email, name: profile.name });
            } catch (e) { /* backend me google endpoint nahi hai - local login fallback */ }

            // Backend fail ho to Google profile se hi local session bana do
            if (!user || !user.id) {
                user = {
                    id: null,
                    name: profile.name || profile.given_name || 'Google User',
                    email: profile.email,
                    role: 'USER',
                    googleUser: true,
                    picture: profile.picture || ''
                };
            }
            setLoggedInUser(user);
            showToast(`Welcome, ${user.name || 'User'}!`, 'success');
            setTimeout(() => {
                if (userIsAdmin()) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = '../index.html';
                }
            }, 800);
        }

        // Google script load (agar Client ID set hai)
        if (GOOGLE_CLIENT_ID) {
            const gScript = document.createElement('script');
            gScript.src = 'https://accounts.google.com/gsi/client';
            gScript.async = true;
            gScript.defer = true;
            document.head.appendChild(gScript);
        }
    </script>
</body>
</html>
