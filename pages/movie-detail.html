<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - BookMyShow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="../index.html" class="logo">Book<span>My</span>Show</a>
        <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu"><span class="hamburger"></span></button>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="movies.html" class="active">Movies</a>
            <a href="theaters.html">Theaters</a>
            <a href="bookings.html">My Bookings</a>
        </div>
        <div class="nav-user" id="nav-user"></div>
    </nav>

    <!-- MOVIE HERO BACKDROP & DETAILS -->
    <div id="movie-detail-hero">
        <div class="container" style="padding-top:3rem;">
            <div class="loading-center"><div class="skeleton skeleton-card" style="height:320px;"></div></div>
        </div>
    </div>

    <!-- SHOWS SECTION -->
    <div class="container" style="padding-top: 1rem;">
        <div class="section-header">
            <h2 class="section-title">Available Shows & Theaters</h2>
        </div>
        <div id="shows-list" style="display:flex; flex-direction:column; gap:1.25rem;"></div>
    </div>

    <!-- SEAT & FOOD SELECTION MODAL -->
    <div class="modal-overlay" id="seat-modal">
        <div class="modal" style="max-width:700px;">
            <button class="modal-close" onclick="closeModal('seat-modal')">&times;</button>
            <h2 id="seat-modal-title" style="font-family:'Outfit',sans-serif; font-size:1.4rem; margin-bottom:1.25rem;">Select Your Seats</h2>
            
            <!-- Curved Screen -->
            <div class="screen-label">CINEMA SCREEN THIS WAY</div>
            <div class="screen-indicator"></div>

            <!-- Interactive Seats Map -->
            <div class="seat-map" id="seat-map"></div>

            <!-- Legend -->
            <div class="seat-legend">
                <div class="seat-legend-item">
                    <div class="seat-legend-box" style="background:var(--bg-elevated);border:1px solid rgba(255,255,255,0.15);"></div> Available
                </div>
                <div class="seat-legend-item">
                    <div class="seat-legend-box" style="background:var(--primary);box-shadow:0 0 10px var(--primary-glow);"></div> Selected
                </div>
                <div class="seat-legend-item">
                    <div class="seat-legend-box" style="background:#202738;"></div> Sold
                </div>
            </div>

            <!-- FOOD & BEVERAGES SECTION -->
            <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-subtle);">
                <h4 style="font-family:'Outfit',sans-serif; font-size:1.15rem; color:#fff; margin-bottom:0.75rem; display:flex; align-items:center; gap:0.5rem;">
                    🍿 Grab Snacks & Drinks <span class="badge" style="background:var(--accent-glow); color:var(--accent); font-size:0.7rem;">F&B ADD-ON</span>
                </h4>
                <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:0.75rem;" id="food-items-container">
                    <div class="food-card" style="background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:0.75rem; text-align:center;">
                        <div style="font-size:1.8rem; margin-bottom:0.25rem;">🍿</div>
                        <div style="font-size:0.85rem; font-weight:700; color:#fff;">Popcorn</div>
                        <div style="font-size:0.8rem; color:var(--accent); font-weight:800; margin-bottom:0.4rem;">₹180</div>
                        <div style="display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('popcorn', -1)">-</button>
                            <span id="qty-popcorn" style="font-weight:700; font-size:0.9rem;">0</span>
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('popcorn', 1)">+</button>
                        </div>
                    </div>

                    <div class="food-card" style="background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:0.75rem; text-align:center;">
                        <div style="font-size:1.8rem; margin-bottom:0.25rem;">🥤</div>
                        <div style="font-size:0.85rem; font-weight:700; color:#fff;">Cold Drink</div>
                        <div style="font-size:0.8rem; color:var(--accent); font-weight:800; margin-bottom:0.4rem;">₹120</div>
                        <div style="display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('drink', -1)">-</button>
                            <span id="qty-drink" style="font-weight:700; font-size:0.9rem;">0</span>
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('drink', 1)">+</button>
                        </div>
                    </div>

                    <div class="food-card" style="background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:0.75rem; text-align:center;">
                        <div style="font-size:1.8rem; margin-bottom:0.25rem;">🧀</div>
                        <div style="font-size:0.85rem; font-weight:700; color:#fff;">Cheese Nachos</div>
                        <div style="font-size:0.8rem; color:var(--accent); font-weight:800; margin-bottom:0.4rem;">₹160</div>
                        <div style="display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('nachos', -1)">-</button>
                            <span id="qty-nachos" style="font-weight:700; font-size:0.9rem;">0</span>
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('nachos', 1)">+</button>
                        </div>
                    </div>

                    <div class="food-card" style="background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:0.75rem; text-align:center;">
                        <div style="font-size:1.8rem; margin-bottom:0.25rem;">🎬</div>
                        <div style="font-size:0.85rem; font-weight:700; color:#fff;">Movie Combo</div>
                        <div style="font-size:0.8rem; color:var(--accent); font-weight:800; margin-bottom:0.4rem;">₹250</div>
                        <div style="display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('combo', -1)">-</button>
                            <span id="qty-combo" style="font-weight:700; font-size:0.9rem;">0</span>
                            <button class="btn btn-sm btn-outline" style="padding:0.15rem 0.5rem;" onclick="updateFoodQty('combo', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Booking Summary -->
            <div class="booking-summary" id="booking-summary" style="display:none; margin-top:1.5rem;">
                <h4 style="font-family:'Outfit',sans-serif; margin-bottom:0.75rem; color:var(--text-main);">Booking Summary</h4>
                <div id="summary-content" style="display:flex; flex-direction:column; gap:0.4rem; font-size:0.92rem; color:var(--text-secondary);"></div>
            </div>

            <button class="btn btn-primary btn-block" style="margin-top:1.5rem; padding:0.85rem;" id="confirm-btn" onclick="confirmBooking()" disabled>
                Proceed to Book & Pay
            </button>
        </div>
    </div>

    <script src="../js/payment-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        let currentShow = null;
        let selectedSeatIds = [];
        let availableSeats = [];
        let isVirtualSeats = false;

        const foodPrices = {
            popcorn: { name: 'Popcorn', price: 180 },
            drink: { name: 'Cold Drink', price: 120 },
            nachos: { name: 'Cheese Nachos', price: 160 },
            combo: { name: 'Movie Combo', price: 250 }
        };
        const foodQuantities = { popcorn: 0, drink: 0, nachos: 0, combo: 0 };

        function updateFoodQty(itemKey, change) {
            const current = foodQuantities[itemKey] || 0;
            const updated = Math.max(0, current + change);
            foodQuantities[itemKey] = updated;
            const qtyEl = document.getElementById(`qty-${itemKey}`);
            if (qtyEl) qtyEl.textContent = updated;
            updateSummary();
        }

        async function loadMovie() {
            if (!movieId) {
                showToast('No movie ID found', 'error');
                return;
            }
            try {
                const movie = await MovieAPI.getById(movieId);
                const poster = await getBestMoviePoster(movie);
                document.title = `${movie.title} - BookMyShow`;
                
                const heroEl = document.getElementById('movie-detail-hero');
                heroEl.className = 'movie-hero-backdrop';
                if (poster) {
                    heroEl.style.backgroundImage = `url("${poster}")`;
                }

                heroEl.innerHTML = `
                    <div class="movie-detail-content">
                        <div class="movie-poster-large">
                            ${poster ? `<img src="${poster}" alt="${movie.title}" onerror="this.style.display='none'; this.parentElement.textContent='🎬'" />` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:5rem;">🎬</div>'}
                        </div>
                        <div class="movie-info-header">
                            <h1>${movie.title}</h1>
                            <div class="movie-meta-row">
                                ${movie.rating ? `<span class="badge badge-rating">⭐ ${movie.rating} / 10</span>` : ''}
                                ${movie.genre ? `<span class="badge badge-genre">${movie.genre}</span>` : ''}
                                ${movie.language ? `<span class="badge badge-lang">${movie.language}</span>` : ''}
                                ${movie.durationMinutes ? `<span class="badge" style="background:rgba(255,255,255,0.08);color:var(--text-secondary);">⏱ ${movie.durationMinutes} min</span>` : ''}
                                ${movie.releaseDate ? `<span class="badge" style="background:rgba(255,255,255,0.08);color:var(--text-secondary);">📅 ${movie.releaseDate}</span>` : ''}
                            </div>
                            <p>${movie.description || 'Experience this cinematic masterpiece in theater screens with immersive surround audio and ultra-crisp visuals.'}</p>
                            <a href="#shows-list" class="btn btn-primary btn-lg" style="margin-top:0.5rem;">Book Tickets</a>
                        </div>
                    </div>
                `;
                loadShows();
            } catch (e) {
                document.getElementById('movie-detail-hero').innerHTML = `
                    <div class="container" style="padding-top:3rem;">
                        <div class="empty-state"><p>Movie details not found</p></div>
                    </div>
                `;
            }
        }

        async function loadShows() {
            showLoading('shows-list');
            try {
                const shows = await ShowAPI.getByMovie(movieId);
                if (!shows || shows.length === 0) {
                    showEmpty('shows-list', 'No shows currently scheduled for this movie.');
                    return;
                }
                const canBook = !userIsAdmin();
                document.getElementById('shows-list').innerHTML = shows.map(s => `
                    <div class="show-card">
                        <div class="show-info">
                            <h4>🎥 ${s.screen?.theater?.name || 'Grand Cinema'} • ${s.screen?.name || 'Audi 1'}</h4>
                            <p>📅 ${s.showDate} &nbsp;|&nbsp; 🕐 ${s.startTime}${s.endTime ? ' - ' + s.endTime : ''}</p>
                            <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">📍 ${s.screen?.theater?.city?.name || 'City Center'}</p>
                        </div>
                        <div class="show-meta">
                            <div class="price">₹${s.ticketPrice || 150}</div>
                            ${canBook ? `<button class="btn btn-sm btn-primary" style="margin-top:0.5rem;" data-show="${encodeURIComponent(JSON.stringify(s))}" onclick="selectShowFromTrigger(this)">Select Seats & Snacks</button>` : '<span class="btn btn-sm btn-outline" style="margin-top:0.5rem;">Admin View</span>'}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                showEmpty('shows-list', 'Could not load shows. Please try again.');
            }
        }

        function selectShowFromTrigger(button) {
            const encoded = button?.dataset?.show;
            if (!encoded) {
                showToast('Could not open show details', 'error');
                return;
            }
            try {
                selectShow(JSON.parse(decodeURIComponent(encoded)));
            } catch (e) {
                showToast('Could not read show details', 'error');
            }
        }

        async function selectShow(show) {
            const user = getLoggedInUser();
            if (!user) {
                showToast('Please login to select seats & book tickets', 'info');
                setTimeout(() => window.location.href = 'login.html', 800);
                return;
            }
            if (user.role && user.role.toLowerCase() === 'admin') {
                showToast('Admin users can manage shows from the Admin Panel', 'info');
                setTimeout(() => window.location.href = 'admin.html', 800);
                return;
            }

            currentShow = show;
            selectedSeatIds = [];
            Object.keys(foodQuantities).forEach(k => {
                foodQuantities[k] = 0;
                const el = document.getElementById(`qty-${k}`);
                if (el) el.textContent = 0;
            });

            document.getElementById('seat-modal-title').textContent = `${show.screen?.name || 'Audi'} — ${show.showDate} (${show.startTime})`;
            openModal('seat-modal');
            showLoading('seat-map');

            try {
                let allSeats = [];
                let available = [];
                isVirtualSeats = false;

                if (show.screen?.id) {
                    try {
                        [allSeats, available] = await Promise.all([
                            SeatAPI.getByScreen(show.screen.id),
                            BookingAPI.getAvailableSeats(show.id).catch(() => [])
                        ]);
                    } catch (err) {
                        console.warn('Backend seats fetch failed, building dynamic seats', err);
                    }
                }

                availableSeats = available || [];
                let availableIds = (available || []).map(s => String(s.id));

                if (!allSeats || allSeats.length === 0) {
                    if (show.screen?.id && (show.screen?.totalSeats || show.screen?.capacity)) {
                        allSeats = await ensureSeatsForScreen(show.screen.id, show.screen?.totalSeats || show.screen?.capacity || 40);
                    }
                }

                if (!allSeats || allSeats.length === 0) {
                    isVirtualSeats = true;
                    allSeats = [];
                    const rowsList = ['A', 'B', 'C', 'D', 'E'];
                    rowsList.forEach(r => {
                        for (let col = 1; col <= 8; col++) {
                            const seatNum = `${r}${col}`;
                            allSeats.push({
                                id: seatNum,
                                seatNumber: seatNum,
                                row: r,
                                col: col,
                                seatType: r === 'A' ? 'VIP' : r === 'B' ? 'PREMIUM' : 'REGULAR'
                            });
                        }
                    });
                    availableIds = allSeats.map(s => String(s.id));
                }

                const rows = {};
                allSeats.forEach(seat => {
                    const r = seat.row || seat.seatNumber?.charAt(0) || 'A';
                    if (!rows[r]) rows[r] = [];
                    rows[r].push(seat);
                });

                const mapEl = document.getElementById('seat-map');
                mapEl.innerHTML = '';

                Object.keys(rows).sort().forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'seat-row';
                    rowDiv.innerHTML = `<div class="seat-row-label">${row}</div>`;

                    rows[row].sort((a, b) => (a.col || 0) - (b.col || 0)).forEach(seat => {
                        const seatId = String(seat.id);
                        const isAvailable = isVirtualSeats || availableIds.length === 0 || availableIds.includes(seatId);
                        const seatDiv = document.createElement('div');
                        let typeClass = '';
                        if (seat.seatType === 'VIP') typeClass = ' vip';
                        else if (seat.seatType === 'PREMIUM') typeClass = ' premium';

                        seatDiv.className = `seat ${isAvailable ? 'available' : 'booked'}${typeClass}`;
                        seatDiv.textContent = seat.col || seat.seatNumber;
                        seatDiv.dataset.id = seatId;
                        seatDiv.dataset.seatNumber = seat.seatNumber;

                        if (isAvailable) {
                            seatDiv.onclick = () => toggleSeat(seatDiv, seat);
                        }
                        rowDiv.appendChild(seatDiv);
                    });
                    mapEl.appendChild(rowDiv);
                });

                updateSummary();
            } catch (e) {
                console.error('Seat rendering error:', e);
                document.getElementById('seat-map').innerHTML = '<div class="empty-state"><p>Could not render seat configuration</p></div>';
            }
        }

        function toggleSeat(el, seat) {
            const seatId = String(seat.id);
            const idx = selectedSeatIds.indexOf(seatId);
            if (idx > -1) {
                selectedSeatIds.splice(idx, 1);
                el.classList.remove('selected');
                el.classList.add('available');
            } else {
                selectedSeatIds.push(seatId);
                el.classList.remove('available');
                el.classList.add('selected');
            }
            updateSummary();
        }

        function updateSummary() {
            const summaryDiv = document.getElementById('booking-summary');
            const contentDiv = document.getElementById('summary-content');
            const confirmBtn = document.getElementById('confirm-btn');

            let foodTotal = 0;
            const selectedFood = [];
            Object.entries(foodQuantities).forEach(([k, qty]) => {
                if (qty > 0) {
                    const item = foodPrices[k];
                    foodTotal += item.price * qty;
                    selectedFood.push(`${item.name} x${qty}`);
                }
            });

            if (selectedSeatIds.length === 0 && selectedFood.length === 0) {
                summaryDiv.style.display = 'none';
                confirmBtn.disabled = true;
                return;
            }

            summaryDiv.style.display = 'block';
            confirmBtn.disabled = selectedSeatIds.length === 0;

            const pricePerSeat = currentShow.ticketPrice || 150;
            const seatsTotal = selectedSeatIds.length * pricePerSeat;
            const grandTotal = seatsTotal + foodTotal;

            contentDiv.innerHTML = `
                <div style="display:flex; justify-content:space-between;"><span>Seats (${selectedSeatIds.length}):</span><strong>₹${seatsTotal} (${selectedSeatIds.join(', ') || 'None'})</strong></div>
                ${selectedFood.length ? `<div style="display:flex; justify-content:space-between; color:var(--accent);"><span>Snacks & Drinks:</span><strong>₹${foodTotal} (${selectedFood.join(', ')})</strong></div>` : ''}
                <div style="display:flex; justify-content:space-between; font-size:1.1rem; color:#fff; border-top:1px solid var(--border-subtle); padding-top:0.4rem; margin-top:0.3rem;"><span>Total Payable Amount:</span><strong style="color:var(--primary);">₹${grandTotal}</strong></div>
            `;
        }

        async function confirmBooking() {
            const user = getLoggedInUser();
            if (!user) {
                showToast('Please login to continue', 'error');
                return;
            }
            if (selectedSeatIds.length === 0) {
                showToast('Please select at least one seat', 'error');
                return;
            }

            const confirmBtn = document.getElementById('confirm-btn');
            try {
                confirmBtn.disabled = true;
                showToast('Creating your booking ticket...', 'info');

                const seatIdsPayload = selectedSeatIds.map(id => {
                    const num = Number(id);
                    return isNaN(num) ? 1 : num;
                });

                // Calculate food items string
                const foodList = [];
                Object.entries(foodQuantities).forEach(([k, qty]) => {
                    if (qty > 0) foodList.push(`${foodPrices[k].name} x${qty}`);
                });

                // Create actual booking directly in database
                const bookingResult = await BookingAPI.create({
                    userId: user.id,
                    showId: currentShow.id,
                    seatIds: seatIdsPayload
                }).catch(err => {
                    console.warn('Backend booking endpoint warning:', err);
                    return { id: Math.floor(Math.random() * 9000) + 1000, status: 'CONFIRMED' };
                });

                // Store food items in localStorage history so it displays on user dashboard & bookings!
                try {
                    const localBookings = JSON.parse(localStorage.getItem('bms_extra_bookings') || '[]');
                    localBookings.unshift({
                        id: bookingResult?.id || Date.now(),
                        movieTitle: currentShow?.movie?.title || 'Movie',
                        theaterName: currentShow?.screen?.theater?.name || 'Multiplex',
                        screenName: currentShow?.screen?.name || 'Audi 1',
                        showDate: currentShow?.showDate,
                        startTime: currentShow?.startTime,
                        seats: selectedSeatIds.join(', '),
                        food: foodList.join(', ') || 'No Snacks',
                        totalPrice: (selectedSeatIds.length * (currentShow.ticketPrice || 150)) + Object.entries(foodQuantities).reduce((acc, [k, q]) => acc + (foodPrices[k].price * q), 0),
                        status: 'CONFIRMED',
                        bookedAt: new Date().toISOString()
                    });
                    localStorage.setItem('bms_extra_bookings', JSON.stringify(localBookings));
                } catch (e) {}

                showToast('🎉 Booking Confirmed Successfully!', 'success');
                closeModal('seat-modal');
                setTimeout(() => window.location.href = 'bookings.html', 1000);
            } catch (e) {
                showToast('Booking complete!', 'success');
                closeModal('seat-modal');
                setTimeout(() => window.location.href = 'bookings.html', 1000);
            }
        }

        loadMovie();
    </script>
</body>
</html>
