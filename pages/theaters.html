<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theaters & Multiplexes - BookMyShow</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="../index.html" class="logo">Book<span>My</span>Show</a>
        <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu"><span class="hamburger"></span></button>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="theaters.html" class="active">Theaters</a>
            <a href="bookings.html">My Bookings</a>
        </div>
        <div class="nav-user" id="nav-user"></div>
    </nav>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Cinema Theaters</h2>
        </div>

        <!-- City filter -->
        <div class="city-bar" id="city-bar" style="background:var(--bg-surface); border-radius:var(--radius-lg); padding:0.75rem 1.25rem; margin-bottom:2rem; border:1px solid var(--border-subtle);">
            <button class="city-chip active" onclick="loadTheaters(); activateChip(this)">All Cities</button>
        </div>

        <div class="grid grid-3" id="theaters-grid"></div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        async function loadCities() {
            try {
                const cities = await CityAPI.getAll();
                const bar = document.getElementById('city-bar');
                if (!cities) return;
                cities.forEach(city => {
                    const chip = document.createElement('button');
                    chip.className = 'city-chip';
                    chip.textContent = city.name;
                    chip.onclick = () => {
                        activateChip(chip);
                        loadTheatersByCity(city.id);
                    };
                    bar.appendChild(chip);
                });
            } catch (e) { console.log('No cities'); }
        }

        function activateChip(el) {
            document.querySelectorAll('.city-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        async function loadTheaters() {
            showLoading('theaters-grid');
            try {
                const theaters = await TheaterAPI.getAll();
                renderTheaters(theaters);
            } catch (e) {
                showEmpty('theaters-grid', 'Could not load theaters');
            }
        }

        async function loadTheatersByCity(cityId) {
            showLoading('theaters-grid');
            try {
                const theaters = await TheaterAPI.getByCity(cityId);
                renderTheaters(theaters);
            } catch (e) {
                showEmpty('theaters-grid', 'No theaters found in this city');
            }
        }

                function renderTheaters(theaters) {
            const grid = document.getElementById('theaters-grid');
            if (!theaters || theaters.length === 0) { showEmpty('theaters-grid', 'No cinema theaters available'); return; }
            grid.innerHTML = theaters.map(t => `
                <div class="card" style="padding:0;">
                    <div class="card-body" style="padding:1.5rem;">
                        <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem;">
                            <div style="width:46px; height:46px; border-radius:var(--radius-md); background:var(--primary-subtle); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:1.5rem;"><i class="fa-solid fa-building-columns"></i></div>
                            <div>
                                <h3 style="font-size:1.2rem; margin:0;">${t.name}</h3>
                                <span style="font-size:0.8rem; color:var(--text-muted);"><i class="fa-solid fa-location-dot"></i> ${t.city?.name || 'City'}, ${t.city?.state || ''}</span>
                            </div>
                        </div>
                        <p style="color:var(--text-secondary); font-size:0.9rem; line-height:1.5; margin-bottom:1rem;">${t.address || 'Premium multiplex audio & 4K laser projection screening.'}</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-sm btn-outline btn-block" onclick="viewScreens(${t.id}, '${t.name}')"><i class="fa-solid fa-desktop"></i> View Screens & Specs</button>
                    </div>
                </div>
            `).join('');
        }

        async function viewScreens(theaterId, theaterName) {
            try {
                const screens = await ScreenAPI.getByTheater(theaterId);
                if (!screens || screens.length === 0) { showToast('No screens found for this theater', 'info'); return; }
                let msg = `▶ ${theaterName}\nAvailable Screens:\n`;
                screens.forEach(s => msg += `\n• ${s.name} (${s.totalSeats || '100'} Seats)`);
                alert(msg);
            } catch (e) {
                showToast('Could not load screens', 'error');
            }
        }

        loadCities();
        loadTheaters();
    </script>
</body>
</html>
