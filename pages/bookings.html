<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - BookMyShow</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="../index.html" class="logo">Book<span>My</span>Show</a>
        <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="Toggle menu"><span class="hamburger"></span></button>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="theaters.html">Theaters</a>
            <a href="bookings.html" class="active">My Bookings</a>
        </div>
        <div class="nav-user" id="nav-user"></div>
    </nav>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title">My Tickets & Food Orders</h2>
        </div>
        <div id="bookings-list" style="display:flex; flex-direction:column; gap:1.5rem;"></div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        function getBookingSeatText(seatData) {
            if (!seatData) return 'N/A';
            if (Array.isArray(seatData)) {
                return seatData.map(seat => seat.seatNumber || seat.seat || `${seat.row || ''}${seat.col || ''}`).join(', ');
            }
            return seatData.seatNumber || seatData.seat || `${seatData.row || ''}${seatData.col || ''}` || 'N/A';
        }

                function formatBookingCard(booking) {
            const seats = getBookingSeatText(booking.seats || booking.seatNumbers || booking.ticketSeats);
            const foodText = Array.isArray(booking.foodItems) && booking.foodItems.length
                ? booking.foodItems.map(item => `${item.name || item.foodName || 'Food'} x${item.quantity || 1}`).join(', ')
                : (booking.food ? booking.food : 'No food added');

            return `
                <div class="card" style="border: 1px solid rgba(46,204,113,0.3);">
                    <div class="card-body" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem;">
                        <div>
                            <h3 style="margin-bottom:0.35rem;"><i class="fa-solid fa-clapperboard"></i> ${booking.show?.movie?.title || booking.movieTitle || 'Movie'}</h3>
                            <p style="color:var(--text-muted); font-size:0.85rem; line-height:1.7;">
                                <i class="fa-solid fa-building-columns"></i> ${booking.show?.screen?.theater?.name || booking.theaterName || ''} — ${booking.show?.screen?.name || booking.screenName || ''}<br>
                                <i class="fa-regular fa-calendar-days"></i> ${booking.show?.showDate || booking.showDate || ''} &nbsp; <i class="fa-regular fa-clock"></i> ${booking.show?.startTime || booking.startTime || ''}<br>
                                <i class="fa-solid fa-couch"></i> Seats: ${seats}<br>
                                <i class="fa-solid fa-hotdog"></i> Food: ${foodText}<br>
                                <i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Booked: ${booking.bookedAt ? new Date(booking.bookedAt).toLocaleString() : 'Just now'}
                            </p>
                        </div>
                        <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:1rem;">
                            <div>
                                <div style="font-size:0.8rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Total Paid</div>
                                <div style="font-family:'Outfit',sans-serif; font-size:1.8rem; font-weight:800; color:var(--success);">₹${booking.totalPrice || 0}</div>
                            </div>
                            <button class="btn btn-sm btn-outline" style="border-color:var(--danger); color:var(--danger);" onclick="cancelBooking('${booking.id}')"><i class="fa-solid fa-trash-can"></i> Cancel Ticket</button>
                        </div>
                    </div>
                </div>
            `;
        }
        

        async function loadBookings() {
            const user = getLoggedInUser();
            if (!user) {
                document.getElementById('bookings-list').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔐</div>
                        <p>Please <a href="login.html" style="color:var(--primary);font-weight:700;">login</a> to view your bookings.</p>
                    </div>`;
                return;
            }

            if (user.role && user.role.toLowerCase() === 'admin') {
                showToast('Admin users should use the Admin Panel', 'info');
                setTimeout(() => window.location.href = 'admin.html', 800);
                return;
            }

            showLoading('bookings-list');
            try {
                const bookings = await BookingAPI.getByUser(user.id);
                const visible = (bookings || []).filter(b => String(b.status || '').toUpperCase() !== 'CANCELLED');

                if (!visible.length) {
                    showEmpty('bookings-list', 'No bookings yet. Go book some movies! 🎬');
                    return;
                }

                document.getElementById('bookings-list').innerHTML = visible.map(formatBookingCard).join('');
            } catch (e) {
                showEmpty('bookings-list', 'Could not load your ticket history.');
            }
        }

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this ticket booking?')) return;
            try {
                await BookingAPI.cancel(id).catch(() => {});
                showToast('Booking cancelled successfully', 'success');
                loadBookings();
            } catch (e) {
                showToast(e.message || 'Could not cancel booking', 'error');
            }
        }

        loadBookings();
    </script>
</body>
</html>
